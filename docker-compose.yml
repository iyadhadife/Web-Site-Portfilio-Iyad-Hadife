version: '3.8'

services:
  backend:
    build: ./iyad-portfolio/backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      # Permet de lier le dossier backend local au conteneur pour synchroniser data.json en direct
      - ./iyad-portfolio/backend/data.json:/app/data.json
    environment:
      - ENV=production

  frontend:
    build: ./iyad-portfolio/frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
